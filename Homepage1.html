<!DOCTYPE html>
<html>
<head>
		<title>Frameset PDF Example</title>
</head>
		<frameset cols="25%,*">
		<!--Left Frame:Navigation-->
		<frame src="menu.html"name="menu">	
		<!--Right Frame:Content-->
		<frame src="Content.html"name="content">
		<noframes>
		<body>your browser does not support frames.</body>
		</noframes>
		</frameset>
</html>
